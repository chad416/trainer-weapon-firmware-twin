# Kernel
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_ASSERT=y
CONFIG_POLL=y

# FPU for IMU metrics and the time-sync fit; several threads use it
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Drivers
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_INPUT=y
CONFIG_SENSOR=y
CONFIG_CAN=y
CONFIG_HWINFO=y

# State machine framework (hierarchical states)
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y

# Persistent configuration: settings on NVS in the QSPI storage partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_CRC=y

# Watchdog: one task-watchdog channel per thread, IWDG as hardware fallback
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_REBOOT=y

# Diagnostics
CONFIG_LOG=y
# Deferred logging, but flushed promptly: wake the log thread on every
# message instead of the default 1 s batch, so test harnesses see events
# without a long delay.
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="trainer:~$ "
CONFIG_BOOT_BANNER_STRING="Booting trainer_fw"
